services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    # On Linux, host networking lets the container reach Ollama and Postgres on localhost
    network_mode: host
    environment:
      DATABASE_URL: postgresql://shop:shop@localhost:5432/shop
      LLM_BASE_URL: http://localhost:11434/v1
      LLM_MODEL: qwen2.5:3b
    depends_on:
      - postgres

volumes:
  pgdata: